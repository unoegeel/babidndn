spring:
  application:
    name: babi-order

  profiles:
    default: dev

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:babi_order}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:babi}
    password: ${DB_PASSWORD:babi_local_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Schema mutation is Flyway-owned. Hibernate only validates against the live DB.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

  # Existing non-empty DBs: baseline already applied (baseline-on-migrate=false).
# Schema mutations: V101+ under db/migration. Tests: H2 create-drop, Flyway disabled.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 100
    baseline-description: Existing schema baseline (Hibernate update + BE/scripts era)

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:babidndn.hufs@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

aws:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:babi-order-images}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    login-id: ${ADMIN_LOGIN_ID:admin}
    password: ${ADMIN_PASSWORD:admin_local_password}
  jwt:
    secret: ${JWT_SECRET:babi-local-jwt-secret-key-change-me-123456}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  # Web Push (VAPID). 운영에서는 환경변수로 교체하세요.
  push:
    enabled: ${PUSH_ENABLED:true}
    subject: ${VAPID_SUBJECT:mailto:admin@babidndn.shop}
    public-key: ${VAPID_PUBLIC_KEY:BL992SYJ0qlglk5wtoG8sKV-2IZD7S8oKzD3CvpY6_dhIv7l6RU5wPKMO6nnAzNvXu10tLIzmvNs8YeSkduKMAo}
    private-key: ${VAPID_PRIVATE_KEY:lYVpwCFlzftJJDhCqr73_b4hkkPm_8_tTEtLflt7LaQ}
  mail:
    from: ${MAIL_FROM:babidndn.hufs@gmail.com}
    to: ${MAIL_TO:leegeonu02@gmail.com}
  # Application-level rate limiting (in-memory, per-instance). See ARCHITECTURE.
  rate-limit:
    enabled: true
    cache-maximum-size: 100000
    # Only these connection remotes may supply X-Forwarded-For / X-Real-IP (ClientIpResolver).
    # Do NOT trust all RFC1918 by default — add VPC/proxy CIDRs explicitly per environment.
    # Only these connection remotes may supply X-Forwarded-For / X-Real-IP.
    # Do NOT trust all RFC1918. Configure actual proxy addresses per environment.
    trusted-proxies: "${APP_RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1/32,::1/128}"
    policies:
      order-create:
        client-limit: 6
        client-window-seconds: 60
        ip-limit: 30
        ip-window-seconds: 60
      payment-confirm:
        client-limit: 10
        client-window-seconds: 60
        ip-limit: 60
        ip-window-seconds: 60
      contact:
        client-limit: 3
        client-window-seconds: 600
        ip-limit: 15
        ip-window-seconds: 600
      client-errors:
        client-limit: 30
        client-window-seconds: 60
        ip-limit: 300
        ip-window-seconds: 60
      client-events:
        client-limit: 120
        client-window-seconds: 60
        ip-limit: 1200
        ip-window-seconds: 60
      # Admin + Developer share POST /api/admin/auth/login — single IP bucket.
      auth-login:
        ip-limit: 10
        ip-window-seconds: 300

server:
  port: ${SERVER_PORT:8080}
  # Client IP for rate-limit is resolved by ClientIpResolver (trusted proxies only).
  # Do not use framework ForwardedHeaderFilter (would trust any X-Forwarded-For).
  forward-headers-strategy: none

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n"
