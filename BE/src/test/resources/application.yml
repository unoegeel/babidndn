spring:
  datasource:
    url: jdbc:h2:mem:babi_order_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # Unit/integration tests own schema via H2; do not use Flyway or validate against MySQL.
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  # contextLoads / @SpringBootTest에서 JavaMailSender 자동구성용 (실발송 없음)
  mail:
    host: localhost
    port: 25

toss:
  payments:
    secret-key: test-secret-key
    base-url: https://api.tosspayments.com

aws:
  s3:
    region: ap-northeast-2
    bucket: babi-order-images

# Shared test suite must not hit rate-limit buckets across tests.
app:
  rate-limit:
    enabled: false
