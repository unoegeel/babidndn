services:
  mysql:
    image: mysql:8.4
    container_name: babi-order-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-babi_order}
      MYSQL_USER: ${MYSQL_USER:-babi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-babi_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-babi_root_password}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - babi-order-mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  babi-order-mysql-data:
